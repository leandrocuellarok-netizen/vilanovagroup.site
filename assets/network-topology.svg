<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Vilanova Group conceptual network topology</title>
  <desc id="desc">An archival technical diagram showing a central synthetic face surrounded by six thematic nodes connected by fine measurement lines. The nodes represent strategy, research, capital, partnerships, venture design and knowledge, not existing companies or relationships.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#77766f" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <radialGradient id="field">
      <stop offset="0" stop-color="#20221a"/>
      <stop offset=".62" stop-color="#10110f"/>
      <stop offset="1" stop-color="#090909"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#d4ff3f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#d4ff3f" stop-opacity=".08"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="680" fill="url(#field)"/>
  <rect width="1200" height="680" fill="url(#grid)"/>
  <g fill="none" stroke="#d4ff3f" stroke-opacity=".18">
    <circle cx="600" cy="335" r="155" stroke-dasharray="2 8"/>
    <circle cx="600" cy="335" r="226" stroke-dasharray="1 12"/>
    <circle cx="600" cy="335" r="300" stroke-dasharray="1 18"/>
  </g>
  <g fill="none" stroke="#b9b7ac" stroke-opacity=".36" stroke-width="1.2">
    <path d="M600 335L190 155L1000 145L1040 500L600 590L180 500Z"/>
    <path d="M600 335L600 76M600 335L1090 335M600 335L600 620M600 335L105 335"/>
    <path d="M190 155L1000 145L1040 500L600 590L180 500Z" stroke-dasharray="3 8"/>
  </g>
  <g fill="none" stroke="url(#signal)" stroke-width="2">
    <path d="M600 335L190 155M600 335L1000 145M600 335L1040 500M600 335L600 590M600 335L180 500M600 335L600 76" />
  </g>
  <g transform="translate(600 335)">
    <circle r="122" fill="#0a0b09" stroke="#d4ff3f" stroke-opacity=".7"/>
    <circle r="110" fill="none" stroke="#d4ff3f" stroke-opacity=".26" stroke-dasharray="2 6"/>
    <path d="M-66 -44C-62 -92 -28 -111 0 -111C34 -111 67 -87 68 -42L58 35C51 83 26 101 0 104C-29 101 -54 80 -60 34Z" fill="#c8c5ba" fill-opacity=".09" stroke="#c8c5ba" stroke-opacity=".76" stroke-width="1.5"/>
    <path d="M-59 -32C-38 -52 -18 -54 0 -45C18 -54 40 -51 59 -31M-43 1L-13 4M13 4L43 1M-20 43Q0 53 20 43M0 -44V42M-32 -73L-21 -85M32 -73L21 -85" fill="none" stroke="#d4ff3f" stroke-opacity=".65" stroke-width="1.5"/>
    <path d="M-44 18Q-27 29 -10 18M10 18Q27 29 44 18" fill="none" stroke="#c8c5ba" stroke-opacity=".55"/>
    <circle cx="-27" cy="2" r="3" fill="#d4ff3f"/><circle cx="27" cy="2" r="3" fill="#d4ff3f"/>
    <path d="M-82 -6H-66M66 -6H82M0 -134V-116M0 110V134" stroke="#d4ff3f" stroke-width="1"/>
    <text x="0" y="151" fill="#d4ff3f" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="3">CENTRAL OBSERVATION</text>
  </g>
  <g font-family="monospace" text-anchor="middle">
    <g transform="translate(190 155)"><circle r="42" fill="#10110f" stroke="#d4ff3f" stroke-opacity=".8"/><circle r="34" fill="none" stroke="#c8c5ba" stroke-opacity=".3" stroke-dasharray="2 5"/><path d="M-12 0H12M0 -12V12" stroke="#d4ff3f"/><text y="66" fill="#e1ded4" font-size="13" letter-spacing="2">STRATEGY</text><text y="82" fill="#77766f" font-size="8" letter-spacing="2">NODE / 01</text></g>
    <g transform="translate(1000 145)"><circle r="42" fill="#10110f" stroke="#d4ff3f" stroke-opacity=".8"/><circle r="34" fill="none" stroke="#c8c5ba" stroke-opacity=".3" stroke-dasharray="2 5"/><path d="M-14 9L0 -13L14 9ZM-8 3H8" fill="none" stroke="#d4ff3f"/><text y="66" fill="#e1ded4" font-size="13" letter-spacing="2">RESEARCH</text><text y="82" fill="#77766f" font-size="8" letter-spacing="2">NODE / 02</text></g>
    <g transform="translate(1040 500)"><circle r="42" fill="#10110f" stroke="#d4ff3f" stroke-opacity=".8"/><circle r="34" fill="none" stroke="#c8c5ba" stroke-opacity=".3" stroke-dasharray="2 5"/><path d="M-15 0H15M-10 -9H10M-5 9H5" stroke="#d4ff3f"/><text y="66" fill="#e1ded4" font-size="13" letter-spacing="2">CAPITAL</text><text y="82" fill="#77766f" font-size="8" letter-spacing="2">NODE / 03</text></g>
    <g transform="translate(600 590)"><circle r="42" fill="#10110f" stroke="#d4ff3f" stroke-opacity=".8"/><circle r="34" fill="none" stroke="#c8c5ba" stroke-opacity=".3" stroke-dasharray="2 5"/><circle r="12" fill="none" stroke="#d4ff3f"/><circle r="3" fill="#d4ff3f"/><text y="66" fill="#e1ded4" font-size="13" letter-spacing="2">PARTNERSHIPS</text><text y="82" fill="#77766f" font-size="8" letter-spacing="2">NODE / 04</text></g>
    <g transform="translate(180 500)"><circle r="42" fill="#10110f" stroke="#d4ff3f" stroke-opacity=".8"/><circle r="34" fill="none" stroke="#c8c5ba" stroke-opacity=".3" stroke-dasharray="2 5"/><path d="M-14 12L0 -14L14 12ZM-8 5H8" fill="none" stroke="#d4ff3f"/><text y="66" fill="#e1ded4" font-size="13" letter-spacing="2">VENTURE DESIGN</text><text y="82" fill="#77766f" font-size="8" letter-spacing="2">NODE / 05</text></g>
    <g transform="translate(600 76)"><circle r="42" fill="#10110f" stroke="#d4ff3f" stroke-opacity=".8"/><circle r="34" fill="none" stroke="#c8c5ba" stroke-opacity=".3" stroke-dasharray="2 5"/><path d="M-15 -8H15M-15 0H15M-15 8H15" stroke="#d4ff3f"/><text y="-59" fill="#e1ded4" font-size="13" letter-spacing="2">KNOWLEDGE</text><text y="-45" fill="#77766f" font-size="8" letter-spacing="2">NODE / 06</text></g>
  </g>
  <g fill="#d4ff3f" font-family="monospace" font-size="9" letter-spacing="2" opacity=".65">
    <text x="34" y="34">VG / NETWORK STUDY — 003</text>
    <text x="1166" y="34" text-anchor="end">SCHEMATIC / 01</text>
