name: Vilanova Site Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-validation-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the English site and intelligence tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run structural and JavaScript checks
        run: node scripts/validate-site.mjs
      - name: Validate provider capabilities and connection permissions
        run: node scripts/validate-provider-registry.mjs
      - name: Run provider registry regression tests
        run: node scripts/test-provider-registry.mjs
      - name: Run offline GDELT news adapter regression tests
        run: node scripts/test-gdelt-doc-adapter.mjs
      - name: Run media discovery human-review queue regression tests
        run: node scripts/test-media-review-queue.mjs
      - name: Run reviewed media candidate promotion regression tests
        run: node scripts/test-media-evidence-promotion.mjs
      - name: Validate Argentina media ownership claim registry
        run: node scripts/validate-media-ownership-registry.mjs
      - name: Run media ownership registry regression tests
        run: node scripts/test-media-ownership-registry.mjs
      - name: Run AI Fabric prompt quality regression tests
        run: node scripts/test-fabric-prompt.mjs
      - name: Run AI Fabric API contract regression tests
        run: node scripts/test-ai-fabric-contract.mjs
      - name: Run AI Fabric gateway security and budget tests
        run: node scripts/test-ai-fabric-gateway.mjs
      - name: Validate evidence ledger
        run: node scripts/validate-evidence-ledger.mjs
      - name: Run evidence ledger regression tests
        run: node scripts/test-evidence-ledger.mjs
      - name: Validate Argentina public influencer directory
        run: node scripts/validate-influencer-profiles.mjs
      - name: Run public influencer directory regression tests
        run: node scripts/test-influencer-profiles.mjs
      - name: Audit influencer profile freshness
        run: node scripts/audit-influencer-freshness.mjs
      - name: Test influencer profile freshness audit
        run: node scripts/test-influencer-freshness.mjs
      - name: Export JSON and spreadsheet-safe CSV review queues
        run: |
          mkdir -p artifacts
          node scripts/audit-influencer-freshness.mjs --json > artifacts/influencer-review-queue.json
          node scripts/audit-influencer-freshness.mjs --csv > artifacts/influencer-review-queue.csv
      - name: Upload influencer review queue
        uses: actions/upload-artifact@v4
        with:
          name: influencer-review-queue
          path: artifacts/influencer-review-queue.*
          if-no-files-found: error
          retention-days: 14
      - name: Build 24-hour Influence Radar evidence snapshot
        run: node scripts/influence-radar.mjs
      - name: Run Influence Radar aggregation regression tests
        run: node scripts/test-influence-radar.mjs
      - name: Build evidence-backed commercial intelligence report
        run: node scripts/build-commercial-intelligence.mjs
      - name: Run commercial intelligence regression tests
        run: node scripts/test-commercial-intelligence.mjs
      - name: Export commercial intelligence JSON and spreadsheet-safe CSV
        run: |
          node scripts/build-commercial-intelligence.mjs --json > artifacts/commercial-intelligence.json
          node scripts/build-commercial-intelligence.mjs --csv > artifacts/commercial-intelligence.csv
      - name: Upload commercial intelligence report
        uses: actions/upload-artifact@v4
        with:
          name: commercial-intelligence-report
          path: artifacts/commercial-intelligence.*
          if-no-files-found: error
          retention-days: 14
